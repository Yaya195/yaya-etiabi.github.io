name: V2 static build checks (no deploy)

on:
  push:
    branches:
      - refactor/research-website-v2
      - feat/preprints-project-links-2026
      - feat/experience-cv-page
    paths:
      - 'site-v2/**'
      - '.github/workflows/site-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build canonical organization-root site
        env:
          SITE_URL: https://yaya-etiabi.github.io
          BASE_PATH: /
        run: |
          npm run build
          npm run test:links
          npm run test:seo
          test -f dist/sitemap.xml
          grep -q 'https://yaya-etiabi.github.io/projects/locllm/' dist/sitemap.xml
          test -f dist/about.html
          test -f dist/contact.html
      - name: Build fork preview under project subpath
        env:
          SITE_URL: https://Yaya195.github.io
          BASE_PATH: /yaya-etiabi.github.io/
        run: |
          npm run build
          npm run test:links
          npm run test:seo
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'https://yaya-etiabi.github.io/' dist/index.html
          if grep -q 'href="https://yaya195.github.io/yaya-etiabi.github.io/' dist/index.html; then
            echo "Preview canonical incorrectly contains project base" >&2
            exit 1
          fi
